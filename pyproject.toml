[project]
name = "umeko-serial-mcp"
version = "0.1.4"
description = "Local serial communication service based on MCP protocol with built-in Web monitoring"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "umeiko", email = "umeko@stu.xmu.edu.cn" }
]
keywords = ["mcp", "serial", "uart", "esp32", "embedded", "websocket", "monitor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0",
    "pyserial>=3.5",
    "websockets>=16.0",
]

[project.scripts]
start-serial-mcp = "umeko_serial_mcp:main"

[project.urls]
Homepage = "https://github.com/umeiko/umeko_serial_mcp"
Repository = "https://github.com/umeiko/umeko_serial_mcp"
Issues = "https://github.com/umeiko/umeko_serial_mcp/issues"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
